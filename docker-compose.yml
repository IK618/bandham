services:
  # 1. PostgreSQL 16 Database with Trigram Search
  postgres:
    image: postgres:16-alpine
    container_name: bandhan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bandhan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bandhan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: bandhan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bandhan_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bandhan_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: development
    ports:
      - "8001:8000"

  # 4. Next.js 15 App Router Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bandhan_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
